name: Format Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'style(database): format operational repositories'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - run: pnpm exec prettier --write packages/database/src/operational-repositories.ts
      - name: Commit formatting repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git add packages/database/src/operational-repositories.ts
          git commit -m "style(database): format operational repositories"
          git push origin HEAD:main
