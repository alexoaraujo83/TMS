name: Temporary Format Fix
on:
  push:
    branches: [main]
jobs:
  format:
    if: github.actor == 'alexoaraujo83'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/database/test/matching-carrier.integration.test.ts
      - name: Commit formatter result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/test/matching-carrier.integration.test.ts
          git diff --cached --quiet || git commit -m 'style: format matching carrier integration test'
          git push
