name: Auth0 Production Deploy Config Export

on:
  workflow_dispatch:
    inputs:
      compare_contract:
        description: "Compare the Production export with the source-controlled Auth0 contract"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: auth0-production-deploy-config-export
  cancel-in-progress: true

jobs:
  export:
    name: Export Auth0 Production configuration (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-auth0-readonly
    env:
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DEPLOY_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_DEPLOY_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_DEPLOY_CLIENT_SECRET }}
      AUTH0_AGENT_MODE: "1"
      AUTH0_EXPORT_IDENTIFIERS: "false"
      AUTH0_ALLOW_DELETE: "false"
      NODE_VERSION: "24.20.0"
      AUTH0_DEPLOY_CLI_VERSION: "8.41.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTH0_DOMAIN}" || { echo "::error::Missing AUTH0_DEPLOY_DOMAIN"; exit 1; }
          test -n "${AUTH0_CLIENT_ID}" || { echo "::error::Missing AUTH0_DEPLOY_CLIENT_ID"; exit 1; }
          test -n "${AUTH0_CLIENT_SECRET}" || { echo "::error::Missing AUTH0_DEPLOY_CLIENT_SECRET"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify Node/npm runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Install Auth0 Deploy CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --prefix "${RUNNER_TEMP}/auth0-deploy-cli" \
            --no-save \
            --no-audit \
            --no-fund \
            "auth0-deploy-cli@${AUTH0_DEPLOY_CLI_VERSION}"
          "${RUNNER_TEMP}/auth0-deploy-cli/node_modules/.bin/a0deploy" --help >/dev/null

      - name: Prepare Deploy CLI configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const config = {
            AUTH0_DOMAIN: process.env.AUTH0_DOMAIN,
            AUTH0_CLIENT_ID: process.env.AUTH0_CLIENT_ID,
            AUTH0_CLIENT_SECRET: process.env.AUTH0_CLIENT_SECRET,
            AUTH0_AGENT_MODE: process.env.AUTH0_AGENT_MODE,
            AUTH0_EXPORT_IDENTIFIERS: process.env.AUTH0_EXPORT_IDENTIFIERS,
            AUTH0_ALLOW_DELETE: process.env.AUTH0_ALLOW_DELETE,
            EXCLUDED_PROPS: {
              clients: ["client_secret"],
              connections: ["options.client_secret"],
            },
          };
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/auth0-deploy-config.json",
            JSON.stringify(config, null, 2) + "\\n",
            { mode: 0o600 },
          );
          NODE

      - name: Export Production tenant configuration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/auth0-export"
          mkdir -p "${RUNNER_TEMP}/auth0-export"
          "${RUNNER_TEMP}/auth0-deploy-cli/node_modules/.bin/a0deploy" export \
            --config_file="${RUNNER_TEMP}/auth0-deploy-config.json" \
            --format=yaml \
            --output_folder="${RUNNER_TEMP}/auth0-export"

      - name: Validate export shape
        shell: bash
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/auth0-export/tenant.yaml" || {
            echo "::error::Auth0 Deploy CLI did not produce tenant.yaml"
            find "${RUNNER_TEMP}/auth0-export" -maxdepth 3 -type f -print
            exit 1
          }
          test -d "${RUNNER_TEMP}/auth0-export/actions" || {
            echo "::error::Auth0 Deploy CLI export did not produce the expected actions directory"
            find "${RUNNER_TEMP}/auth0-export" -maxdepth 3 -type d -print
            exit 1
          }

      - name: Compare exported configuration with source contract
        if: ${{ inputs.compare_contract }}
        shell: bash
        env:
          AUTH0_DEPLOY_NODE_MODULES: ${{ runner.temp }}/auth0-deploy-cli/node_modules
        run: |
          set -euo pipefail
          node scripts/auth0/compare-production-export.mjs \
            "${RUNNER_TEMP}/auth0-export/tenant.yaml" \
            "infra/auth0/tenant.yaml" \
            "infra/auth0/actions/post-login.js"

      - name: Publish comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth0-production-export-evidence
          path: |
            ${{ runner.temp }}/auth0-export/tenant.yaml
            ${{ runner.temp }}/auth0-export/actions
          if-no-files-found: error
          retention-days: 7

      - name: Safety assertion
        shell: bash
        run: |
          set -euo pipefail
          echo "Export completed. No Auth0 import, update, create, or delete operation was executed."
