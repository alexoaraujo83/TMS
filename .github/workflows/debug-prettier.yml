name: debug-prettier

on:
  push:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/test/auth-guard.security.test.ts
      - run: git diff -- apps/api/test/auth-guard.security.test.ts
      - run: cat apps/api/test/auth-guard.security.test.ts
