name: Restore Verification

on:
  workflow_dispatch:
    inputs:
      backup_object:
        description: "S3 object of the selected verified backup"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: restore-verification
  cancel-in-progress: false

jobs:
  restore-verify:
    name: Restore verification against isolated target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: restore-verification
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client and OpenSSL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates curl openssl
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Execute isolated restore verification
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_OBJECT: ${{ inputs.backup_object }}
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
          EXPECTED_MIGRATION_COUNT: ${{ secrets.EXPECTED_MIGRATION_COUNT }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: system
        run: |
          set -euo pipefail
          test -n "${RESTORE_DATABASE_URL}"
          test -n "${BACKUP_OBJECT}"
          if ! printf '%s' "${BACKUP_OBJECT}" | grep -Eq '^tms/postgres/[0-9]{8}T[0-9]{6}Z/tms-[0-9]{8}T[0-9]{6}Z\.dump\.enc          if printf '%s' "${RESTORE_DATABASE_URL}" | grep -Eq '(^|[/?])((localhost|127\\.0\\.0\\.1)|prod|production)'; then
            echo "Refusing restore target that looks like production/local."
            exit 1
          fi
          echo "pg_restore=$(command -v pg_restore)"
          pg_restore --version
          chmod 0755 infra/backup/restore-verify.sh
          infra/backup/restore-verify.sh
; then
            echo "Refusing backup object outside the controlled TMS backup namespace." >&2
            exit 1
          fi
          if printf '%s' "${RESTORE_DATABASE_URL}" | grep -Eq '(^|[/?])((localhost|127\\.0\\.0\\.1)|prod|production)'; then
            echo "Refusing restore target that looks like production/local."
            exit 1
          fi
          echo "pg_restore=$(command -v pg_restore)"
          pg_restore --version
          chmod 0755 infra/backup/restore-verify.sh
          infra/backup/restore-verify.sh
