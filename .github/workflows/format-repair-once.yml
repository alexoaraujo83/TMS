name: One-time format repair

on:
  push:
    branches: [chore/format-repair-956bc681]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:fix
      - run: pnpm format:check
      - name: Commit repaired formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/format-repair-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: repair Prettier formatting"
          git push origin HEAD:chore/format-repair-956bc681
