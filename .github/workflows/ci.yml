name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tms_dev
          POSTGRES_USER: tms
          POSTGRES_PASSWORD: tms
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tms -d tms_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_ADMIN_URL: postgresql://tms:tms@localhost:5432/tms_dev
      DATABASE_URL: postgresql://tms:tms@localhost:5432/tms_dev
      RUN_DB_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tms/database migrate
      - name: Provision CI database roles
        shell: bash
        run: |
          set -euo pipefail
          runtime_password="$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")"
          admin_password="$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")"
          PGPASSWORD=tms psql "postgresql://tms@localhost:5432/tms_dev"             -v ON_ERROR_STOP=1             -c "ALTER ROLE tms_app PASSWORD '$runtime_password'"
          PGPASSWORD=tms psql "postgresql://tms@localhost:5432/tms_dev"             -v ON_ERROR_STOP=1             -c "DROP ROLE IF EXISTS tms_ci_admin"
          PGPASSWORD=tms psql "postgresql://tms@localhost:5432/tms_dev"             -v ON_ERROR_STOP=1             -c "CREATE ROLE tms_ci_admin LOGIN SUPERUSER PASSWORD '$admin_password'"
          printf 'DATABASE_URL=postgresql://tms_app:%s@localhost:5432/tms_dev\n' "$runtime_password" >> "$GITHUB_ENV"
          printf 'RUNTIME_DATABASE_URL=postgresql://tms_app:%s@localhost:5432/tms_dev\n' "$runtime_password" >> "$GITHUB_ENV"
          printf 'DATABASE_ADMIN_URL=postgresql://tms_ci_admin:%s@localhost:5432/tms_dev\n' "$admin_password" >> "$GITHUB_ENV"
      - name: Validate runtime role attributes
        run: |
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c "select rolname, rolsuper, rolbypassrls, rolcanlogin from pg_roles where rolname = 'tms_app'"
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c "select has_function_privilege('tms_app', 'public.check_tenant_membership(text, uuid)', 'execute') as runtime_can_execute, has_function_privilege('public', 'public.check_tenant_membership(text, uuid)', 'execute') as public_can_execute"
      - name: Validate RLS with non-bypass runtime role
        run: pnpm --filter @tms/database exec node --import tsx --test test/rls-runtime.integration.test.ts
      - name: Validate IAM runtime resolver
        run: pnpm --filter @tms/database exec node --import tsx --test test/iam-runtime.integration.test.ts
      - name: Validate worker Durable Jobs PostgreSQL integration
        run: pnpm --filter @tms/worker exec tsx --test src/durable-jobs.integration.test.ts
      - name: Validate worker freight status outbox to durable job integration
        run: pnpm --filter @tms/database build && pnpm --filter @tms/worker exec tsx --test src/freight-status-flow.integration.test.ts
      - run: pnpm format:fix
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
