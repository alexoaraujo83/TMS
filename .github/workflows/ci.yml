name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tms_dev
          POSTGRES_USER: tms
          POSTGRES_PASSWORD: tms
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tms -d tms_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://tms:tms@localhost:5432/tms_dev
      RUNTIME_DATABASE_URL: postgresql://tms_app:tms_app@localhost:5432/tms_dev
      RUN_DB_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - name: Create non-bypass runtime role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'tms_app') THEN
              CREATE ROLE tms_app LOGIN PASSWORD 'tms_app' NOSUPERUSER NOBYPASSRLS;
            ELSE
              ALTER ROLE tms_app LOGIN PASSWORD 'tms_app' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END
          $$;
          GRANT USAGE ON SCHEMA public TO tms_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO tms_app;
          REVOKE ALL ON TABLE public.schema_migrations FROM tms_app;
          SQL
      - run: pnpm --filter @tms/database migrate
      - name: Grant runtime function access
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT EXECUTE ON FUNCTION public.check_tenant_membership(text, uuid) TO tms_app"
      - name: Validate RLS with runtime role
        run: pnpm --filter @tms/database exec node --import tsx --test test/rls-runtime.integration.test.ts
      - name: Validate IAM runtime resolver
        run: pnpm --filter @tms/database exec node --import tsx --test test/iam-runtime.integration.test.ts
      - run: pnpm format:fix
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
