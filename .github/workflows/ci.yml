name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tms_dev
          POSTGRES_USER: tms
          POSTGRES_PASSWORD: tms
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tms -d tms_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://tms:tms@localhost:5432/tms_dev
      RUN_DB_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tms/database migrate
      - run: pnpm exec prettier --write apps/api/test/auth-guard.security.test.ts packages/auth/test/auth.test.ts
      - run: git diff -- apps/api/test/auth-guard.security.test.ts packages/auth/test/auth.test.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
