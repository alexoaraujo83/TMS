name: Stage 5 format repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: "${{ !contains(github.event.head_commit.message, 'style(stage5): apply Prettier formatting') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/modules/operations/operations.module.ts apps/api/src/modules/operations/trip-execution.controller.ts apps/api/src/modules/operations/trip-execution.dto.ts apps/api/src/modules/operations/trip-execution.service.ts packages/database/src/trip-execution-repository.ts packages/database/test/trip-execution.integration.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/operations/operations.module.ts apps/api/src/modules/operations/trip-execution.controller.ts apps/api/src/modules/operations/trip-execution.dto.ts apps/api/src/modules/operations/trip-execution.service.ts packages/database/src/trip-execution-repository.ts packages/database/test/trip-execution.integration.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style(stage5): apply Prettier formatting"
          git push origin HEAD:main
