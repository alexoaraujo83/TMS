name: format-probe
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/database/test/assignment-matching-eligibility.integration.test.ts
      - run: |
          if git diff --quiet -- packages/database/test/assignment-matching-eligibility.integration.test.ts; then
            echo "Prettier produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/test/assignment-matching-eligibility.integration.test.ts
          git commit -m "style(database): apply prettier formatting to assignment eligibility test"
          git push
