name: Format repository once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: normalize repository formatting')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - run: pnpm exec prettier --write .
      - run: git rm .github/workflows/format-fix-once.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: normalize repository formatting"
          git push
