name: Auth0 Production Read-Only Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auth0-production-readonly.yml"
      - "infra/auth0/actions/post-login.js"
      - "infra/auth0/tenant.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth0-production-readonly
  cancel-in-progress: true

jobs:
  audit:
    name: Auth0 Production read-only reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH0_DOMAIN: ${{ secrets.AUTH0_CLI_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLI_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLI_CLIENT_SECRET }}
      AUTH0_AGENT_MODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Auth0 machine credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AUTH0_DOMAIN}" || { echo "::error::Missing repository/environment secret AUTH0_CLI_DOMAIN"; exit 1; }
          test -n "${AUTH0_CLIENT_ID}" || { echo "::error::Missing repository/environment secret AUTH0_CLI_CLIENT_ID"; exit 1; }
          test -n "${AUTH0_CLIENT_SECRET}" || { echo "::error::Missing repository/environment secret AUTH0_CLI_CLIENT_SECRET"; exit 1; }

      - name: Install Auth0 CLI
        shell: bash
        env:
          AUTH0_CLI_VERSION: "1.36.0"
          AUTH0_CLI_SHA256: "5f95695b07ddca90a6cb87392fa0d94c0b945b0f3653f51aa58997c436ba139c"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/auth0-cli.tar.gz"
          curl --fail --silent --show-error --location             "https://github.com/auth0/auth0-cli/releases/download/v${AUTH0_CLI_VERSION}/auth0-cli_${AUTH0_CLI_VERSION}_Linux_x86_64.tar.gz"             --output "${archive}"
          echo "${AUTH0_CLI_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/auth0-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/auth0-bin"
          chmod +x "${RUNNER_TEMP}/auth0-bin/auth0"
          echo "${RUNNER_TEMP}/auth0-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/auth0-bin/auth0" --version

      - name: Authenticate Auth0 CLI with client credentials
        shell: bash
        run: |
          set -euo pipefail
          auth0 login --domain "${AUTH0_DOMAIN}" --client-id "${AUTH0_CLIENT_ID}" --client-secret "${AUTH0_CLIENT_SECRET}"

      - name: Inspect TMS Web application
        shell: bash
        run: |
          set -euo pipefail
          auth0 apps list |
            jq -c '[.[] | select(.name == "TMS Web") | {
              client_id,
              name,
              app_type,
              callbacks,
              allowed_logout_urls,
              allowed_origins,
              web_origins
            }]'

      - name: Inspect Production connections
        shell: bash
        run: |
          set -euo pipefail
          auth0 api get connections |
            jq -c '[.[] | {
              id,
              name,
              strategy,
              enabled_clients
            }]'

      - name: Inspect Post-Login Actions
        shell: bash
        run: |
          set -euo pipefail
          auth0 actions list |
            jq -c '[.[] | select((.supported_triggers // []) | any(.id == "post-login")) | {
              id,
              name,
              status,
              deployed_version,
              updated_at,
              created_at
            }]'

      - name: Inspect active Post-Login trigger bindings
        shell: bash
        run: |
          set -euo pipefail
          auth0 api get "actions/triggers/post-login/bindings" |
            jq -c '{
              bindings: (.bindings // [])
            }'

      - name: Inspect recent failed Auth0 events
        shell: bash
        run: |
          set -euo pipefail
          auth0 logs list --filter "type:f" --number 20 |
            jq -c '[.[] | {
              date,
              type,
              client_id,
              connection,
              event_code: (.details?.error?.code // .details?.error?.type // null)
            }]'

      - name: Inspect source Action syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check infra/auth0/actions/post-login.js

      - name: Audit completed
        run: echo "Auth0 Production read-only audit completed. No Auth0 resources were modified."
