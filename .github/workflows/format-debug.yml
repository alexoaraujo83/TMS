name: Format Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier packages/database/test/iam-role-bootstrap.integration.test.ts > /tmp/formatted.ts
      - run: cat /tmp/formatted.ts
